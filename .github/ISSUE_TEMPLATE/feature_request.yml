name: 功能建议
description: 提一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先说场景，不要直接说方案。「我有 30 个账号，每次找验证码要翻三页」比「加个筛选器」有用得多。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 你设想的交互或行为。不确定也没关系，留空即可。

  - type: textarea
    id: alternatives
    attributes:
      label: 现在你是怎么绕过去的
      description: 已有的替代方案，以及它们哪里不够用。

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我知道 FireMail 的设计重心是**单人自托管**的多账号聚合，不是通用邮件客户端，也不面向团队协作
          required: true
