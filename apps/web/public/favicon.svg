<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="FireMail">
  <title>FireMail</title>
  <!-- 底色取自设计令牌的 primary: oklch(0.55 0.14 42)。刻意用纯色而不是渐变：
       部分渲染器（librsvg）会给渐变加抖动，16px 下会变成明显的横条纹。 -->
  <rect width="32" height="32" rx="7.2" fill="#b35025" />
  <g fill="#fef9f5">
    <rect x="10.4" y="8" width="4.3" height="16" rx="1.5" />
    <rect x="10.4" y="8" width="11.6" height="4.3" rx="1.5" />
    <rect x="10.4" y="14.6" width="8.6" height="3.8" rx="1.4" />
  </g>
</svg>
